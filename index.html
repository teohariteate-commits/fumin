<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>眠りの問診票</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 1画面1テーマのタブレット向け問診。受付 → 眠りの様子 → からだの質問4画面 → 施術者の確認 → 患者さん向けの結果 */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --ink: #232838;
  --muted: #5c6274;
  --line: #d9dce5;
  --accent: #46508f;
  --accent-soft: #e8eaf5;
  --on-accent: #ffffff;
  --staff: #2f5d6e;
  --staff-soft: #e4eef1;
  --warn: #a5552a;
  --warn-soft: #fbeee5;
  --ok: #4f8a3c;
  /* 4つのタイプの色 */
  --A: #b7791f; --B: #6b56a8; --C: #7d6b45; --D: #c4472f;
  /* iPad・Mac は内蔵のヒラギノを先に使い、Web フォントを読み込まない（日本語の Web フォントは iPad では重くなるため） */
  --font-display: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161821; --surface: #20232e; --ink: #e8eaf0; --muted: #a4a9b8; --line: #363a48;
    --accent: #aab2ea; --accent-soft: #2a2d42; --on-accent: #171a2b;
    --staff: #8cc4d6; --staff-soft: #22343a;
    --warn: #f0a77c; --warn-soft: #3a2a22; --ok: #8fc77a;
    --A: #e0a85a; --B: #a996e0; --C: #c4b083; --D: #f08a70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161821; --surface: #20232e; --ink: #e8eaf0; --muted: #a4a9b8; --line: #363a48;
  --accent: #aab2ea; --accent-soft: #2a2d42; --on-accent: #171a2b;
  --staff: #8cc4d6; --staff-soft: #22343a;
  --warn: #f0a77c; --warn-soft: #3a2a22; --ok: #8fc77a;
  --A: #e0a85a; --B: #a996e0; --C: #c4b083; --D: #f08a70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* すばやく続けてタップしても、画面が拡大されないようにする */
button, a, input, textarea, summary { touch-action: manipulation; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 20px; }
.stack { display: flex; flex-direction: column; gap: 20px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0; letter-spacing: .04em; }
.brand .step { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.progress { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.progress span { height: 6px; border-radius: 3px; background: var(--line); }
.progress span.done { background: var(--accent); }

h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.4; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; line-height: 1.4; margin: 0; }
.lead { color: var(--muted); margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel p { margin: 0; }

/* 入力 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-weight: 700; font-size: .95rem; }
.field .opt { color: var(--muted); font-weight: 400; font-size: .85rem; margin-left: 6px; }
input[type="text"], input[type="date"], input[type="number"], input[type="time"], textarea {
  font: inherit; font-size: 1.02rem; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-height: 52px;
}
textarea { line-height: 1.6; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: .98rem; padding: 10px 16px; min-height: 48px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; text-align: left;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.staff-screen .chip[aria-pressed="true"] { background: var(--staff); border-color: var(--staff); }
.chips.big .chip { font-size: 1.05rem; padding: 12px 20px; min-height: 56px; }

/* 設問 */
.howto { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 18px; margin: 0; font-size: .95rem; }
.qs { display: flex; flex-direction: column; gap: 10px; }
.q {
  display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  font: inherit; font-size: 1.08rem; line-height: 1.55; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px; min-height: 68px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.q .box {
  flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.q .box svg { width: 20px; height: 20px; opacity: 0; transition: opacity .15s; }
.q[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.q[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.q[aria-pressed="true"] .box svg { opacity: 1; }
.q .txt { min-width: 0; }
.count-note { color: var(--muted); font-size: .9rem; text-align: right; font-variant-numeric: tabular-nums; margin: 0; }

/* 下のナビ */
nav.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
nav.bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; }
.btn {
  font: inherit; font-weight: 700; font-size: 1.05rem; min-height: 56px; padding: 0 22px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.btn.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 回答の終わり（患者さんへ） */
.done-note { margin-top: 28px; background: var(--accent-soft); border: 2px solid var(--accent); border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.done-note h3 { margin: 0; font-size: 1.3rem; color: var(--ink); }
.done-note p { margin: 0; font-size: 1.1rem; line-height: 1.8; }
.done-note strong { color: var(--accent); }

/* 施術者の確認画面 */
.staff-banner { background: var(--staff-soft); color: var(--ink); border-left: 5px solid var(--staff); border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.staff-banner strong { color: var(--staff); letter-spacing: .06em; font-size: .85rem; }
.staff-screen .eyebrow { color: var(--staff); }
.warn { background: var(--warn-soft); border-left: 5px solid var(--warn); border-radius: 0 var(--radius) var(--radius) 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.warn strong { color: var(--warn); letter-spacing: .06em; font-size: .85rem; }
.warn ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.kv { display: grid; grid-template-columns: 8em 1fr; gap: 6px 12px; font-size: .95rem; margin: 0; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 6px; } }

/* 結果 */
.result-head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: .8rem; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.sho-card { border: 1.5px solid var(--line); border-top: 6px solid var(--tc); border-radius: var(--radius); background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.sho-card .role { font-size: .8rem; font-weight: 700; color: var(--tc); letter-spacing: .08em; }
.sho-card .term { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.3; }
.sho-card .yomi { color: var(--muted); font-size: .9rem; margin-top: -6px; }
.sho-card p { margin: 0; }
.sho-card .sum { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.8; }
.sub-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
.sub-line .tag { font-size: .78rem; font-weight: 700; color: var(--tc); letter-spacing: .08em; }
.sub-line .t { font-weight: 700; }
.why p { line-height: 1.9; }
.sign { background: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: .95rem; }
.sign b { color: var(--tc); }

.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 6.5em 1fr 3.2em; gap: 12px; align-items: center; font-size: .92rem; }
.bar-row .lbl { min-width: 0; }
.bar-row .track { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
.bar-row .fill { height: 100%; background: var(--tc); border-radius: 7px; }
.bar-row .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.plan-item { background: var(--bg); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.plan-item .k { font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.plan-item .v { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.pre { white-space: pre-wrap; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .92rem; background: var(--bg); }

/* 通院の流れ */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .stages { grid-template-columns: 1fr; } }
.stage { border: 1px solid var(--line); border-top: 6px solid var(--accent); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.stage:nth-child(2) { border-top-color: color-mix(in srgb, var(--accent) 65%, var(--surface)); }
.stage:nth-child(3) { border-top-color: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
.stage .when { font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.stage b { font-family: var(--font-display); font-size: 1.12rem; }
.stage p { font-size: .92rem; line-height: 1.65; }

.advice { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.adv { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.adv .h { font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.adv .h::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--hc, var(--accent)); flex: none; }
.adv ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; font-size: .95rem; }
.comment { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.8; border-left: 4px solid var(--accent); padding-left: 14px; }
.believe { background: var(--accent-soft); border-radius: var(--radius); padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; }
.believe p { margin: 0; font-family: var(--font-display); font-size: 1.12rem; line-height: 1.95; }
.believe .last { font-weight: 700; }
.notice { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: .95rem; margin: 0; }
.notice.alert { border-left-color: var(--warn); background: var(--warn-soft); }
.small { font-size: .85rem; color: var(--muted); margin: 0; }
.clinic { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: .08em; text-align: right; margin: 0; padding-top: 10px; border-top: 1px solid var(--line); }

.staff summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.staff pre, .staff-pre {
  white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: .92rem;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0;
}
.copy-row, .out-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.copied { color: var(--ok); font-weight: 700; font-size: .9rem; }

/* 次の方へ の確認 */
.confirm { position: fixed; inset: 0; z-index: 20; background: rgba(20, 22, 30, .45); display: grid; place-items: center; padding: 16px; }
.confirm .box2 { background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 24px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 16px; }
.confirm .acts { display: flex; gap: 12px; }
.confirm .acts .btn { flex: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 印刷: 患者さん向けの結果だけを、明るい配色で A4 に出す */
@media print {
  :root:root:root {
    --bg: #ffffff; --surface: #ffffff; --ink: #232838; --muted: #5c6274; --line: #d9dce5;
    --accent: #46508f; --accent-soft: #e8eaf5; --on-accent: #ffffff; --warn: #a5552a; --warn-soft: #fbeee5;
    --A: #b7791f; --B: #6b56a8; --C: #7d6b45; --D: #c4472f;
    color-scheme: light;
  }
  @page { size: A4; margin: 12mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-size: 11pt; padding: 0; }
  body::before, header.top, nav.bar, .no-print, details.staff, .confirm { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  /* iPad の Safari は flex の中身をページの境目で切ってしまう。印刷では flex をやめて、ふつうの縦の並びにする */
  .wrap, .stack, .panel, .sho-card, .believe, .result-head, .stage, .adv, .field { display: block; }
  .eyebrow, .role, .term, .yomi, .when, .stage b, .field .label { display: block; }
  .wrap > * + *, .stack > * + * { margin-top: 14px; }
  .panel > * + *, .sho-card > * + *, .believe > * + *, .stage > * + *, .adv > * + *, .field > * + * { margin-top: 8px; }
  .sho-card .yomi { margin-top: 2px; }
  .sho-card, .stage, .adv, .believe, .notice, .field { break-inside: avoid; page-break-inside: avoid; }
  p { orphans: 3; widows: 3; }
  /* 印刷では外枠をやめて、上の区切り線だけにする（iPad はページの境目で枠線を切るため） */
  .panel { border: none; border-top: 1.5px solid var(--line); border-radius: 0; padding: 12px 0 0; }
  .eyebrow, h2, h3 { break-after: avoid; page-break-after: avoid; }
  .sho-card, .stage, .adv { border-left: none; border-right: none; border-bottom: none; border-radius: 0; padding: 10px 0 0; }
  .sub-line { border: none; border-radius: 0; padding: 0; }
  .believe, .notice { border-radius: 0; }
  .stages { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .advice { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>眠りの問診票</h1>
      <span class="step" id="stepLabel"></span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>
  <main id="screen"></main>
</div>

<nav class="bar" aria-label="ページ移動">
  <div class="in">
    <button class="btn" id="backBtn" type="button">もどる</button>
    <button class="btn primary" id="nextBtn" type="button">はじめる</button>
  </div>
</nav>

<div class="confirm" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="box2">
    <h2 id="confirmTitle" style="font-size:1.25rem">入力内容を消して、次の方へ進みますか？</h2>
    <p class="small">この問診票はデータを保存しません。消すと元に戻せないので、必要な内容はカルテに書き写してから進んでください。</p>
    <div class="acts">
      <button class="btn" id="cancelReset" type="button">やめる</button>
      <button class="btn primary" id="doReset" type="button">消して次の方へ</button>
    </div>
  </div>
</div>

<script>
const CLINIC = "はりお灸サロンテオ";
const CHECK_SVG = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10.5l4 4 8-9" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// 不眠の4つのタイプ。A・B は「足りない（虚）」、C・D は「たまりすぎ・高ぶり（実）」。各8問ずつ、下の SECTIONS に散らしてある
const TYPES = {
  A: { term: "心脾両虚", yomi: "しんぴりょうきょ", nick: "気くばり疲れさん", group: "虚",
    sum: "考えごとや疲れが続いて、からだの「蓄え」が少なくなっている状態です。",
    why: [
      "東洋医学では、眠りは「心（しん）」が落ち着くことで訪れると考えます。心を落ち着かせるには、栄養となる「血（けつ）」が十分にあることが大切です。",
      "考えごとや気づかいが続くと、胃腸（東洋医学でいう「脾（ひ）」）が疲れて、食べたものから血をつくる力が落ちてしまいます。血が足りなくなると心が落ち着く場所を失い、眠りが浅くなったり、夢が多くなったり、夜中に目が覚めやすくなります。",
    ],
    signs: "眠りの浅さ・夢の多さ・疲れやすさ・食欲のなさ・動悸",
    how: "胃腸のはたらきを助けて、からだの中で血をつくる力を高めることを目指します。あわせて、心を落ち着かせるところにやさしく鍼やお灸をして、ほっとゆるめる時間をつくります。蓄えを少しずつ取り戻していくタイプなので、続けて整えながら、眠りの深さの変化を一緒に見ていきましょう。",
    short: "胃腸を助けて、からだの蓄えを補うこと",
    tips: ["食事は温かく、よく噛んで。冷たいもの・食べすぎは胃腸を疲れさせます", "寝る前の考えごとは紙に書き出して、「明日の自分」に預けましょう", "夕方以降はがんばりすぎず、早めに休む日をつくりましょう"],
    mind: "がんばってきたからだに、ゆっくり蓄えを戻していきましょう。",
    policy: "補益心脾・養血安神：脾の運化を助けて血を養い、心神を落ち着かせる。刺激はおだやかに、お灸を併用。",
    points: ["心兪", "脾兪", "足三里", "三陰交", "神門", "内関"] },
  B: { term: "心腎不交", yomi: "しんじんふこう", nick: "夜ほてりさん", group: "虚",
    sum: "からだをうるおす力が少なくなり、夜になっても熱が冷めにくい状態です。",

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function counts() {
  const n = Object.fromEntries(KEYS.map((k) => [k, 0]));
  SECTIONS.forEach((s, i) => s.qs.forEach((q, j) => { if (state.checks.has(`${i}-${j}`)) n[q.k]++; }));
  return KEYS.map((k) => ({ ...TYPES[k], key: k, n: n[k] }));
}

function judge() {
  const cs = counts();
  const sorted = [...cs].sort((a, b) => b.n - a.n);
  const max = sorted[0].n;
  if (max === 0) return { main: null, sub: null, cs, close: false };
  const main = sorted[0];
  const sub = sorted[1].n > 0 ? sorted[1] : null;
  // 2位との差が1以内なら、両方のタイプを伝える
  return { main, sub, cs, close: !!sub && main.n - sub.n <= 1 };
}

function autoPick() {
  const { main, sub, close } = judge();
  state.main = main ? main.key : null;
  state.sub = close ? sub.key : null;
  fillPlan();
}

function fillPlan() {
  const m = state.main && TYPES[state.main], s = state.sub && TYPES[state.sub];
  const lines = [];
  if (m) lines.push(`本治：${m.policy}`);
  if (s) lines.push(`あわせて${s.term}に配慮：${s.policy}`);
  lines.push(`標治：安神（${["神門", ...COMMON_PTS].join("・")}）で入眠を助ける。`);
  if (takesPill()) lines.push("睡眠薬服用中：自己判断で減薬・中止しないよう伝える。減らすときは主治医と相談。");
  state.policy = lines.join("\n");

  const pts = [...(m ? m.points : []), ...(s ? s.points.slice(0, 2) : []), ...COMMON_PTS];
  state.points = [...new Set(pts)].join("、");

  const how = [];
  if (m) how.push(m.how);
  else how.push("からだ全体のバランスを整えて、自然に眠りに入りやすいからだを目指します。");
  if (s) how.push(`あわせて、${s.short}も大切にします。`);
  state.how = how.join("\n");
}

  const s = $("screen");
  const label = step === 0 ? "受付" : step === 1 ? "眠りの様子"
    : step <= LAST_Q ? `からだの質問 ${step - Q0 + 1} / ${SECTIONS.length}` : step === STAFF_STEP ? "施術者の確認" : "結果";
  $("stepLabel").textContent = label;
  $("progress").innerHTML = Array.from({ length: TOTAL }, (_, i) => `<span class="${i <= step ? "done" : ""}"></span>`).join("");
  $("backBtn").disabled = step === 0;
  $("nextBtn").textContent = step === 0 ? "はじめる" : step < LAST_Q ? "次へ" : step === LAST_Q ? "スタッフ用（押さずにお声がけください）" : step === STAFF_STEP ? "患者さん用の結果を表示" : "次の方へ";

  if (step === 0) s.innerHTML = intakeHTML();
  else if (step === 1) s.innerHTML = sleepHTML();
  else if (step <= LAST_Q) s.innerHTML = sectionHTML(step - Q0);
  else if (step === STAFF_STEP) s.innerHTML = staffHTML();
  else s.innerHTML = resultHTML();
  if (step === LAST_Q) s.insertAdjacentHTML("beforeend", DONE_HTML);
  bind();
  if (!keepScroll) window.scrollTo({ top: 0 });
}

      <p class="last">ほっと眠れる夜に向かって、一緒に進んでいきましょう。</p>

    <p class="notice">施術のあとに、だるさや眠気が出ることがあります。多くは一時的なものですが、気になることがあれば遠慮なくお知らせください。</p>

        <button class="btn" id="copyBtn" type="button">まとめをコピー</button>

// claude.ai の中（枠の中）では印刷できないので、単独のページとして開いたときだけ印刷ボタンを出す
const canPrint = (() => { try { return window.self === window.top; } catch (e) { return false; } })();

function patientText() {
  const m = state.main && TYPES[state.main], s = state.sub && TYPES[state.sub];
  const L = [];
  L.push(`眠りの問診の結果（${state.date}）${state.name ? `　${state.name} 様` : ""}`);
  L.push("");
  if (state.kind.size) { L.push("■ いまの眠りのお悩み"); L.push([...state.kind].join("、")); L.push(""); }
  if (m) {
    L.push(`■ あなたの眠りのタイプ：${m.nick}（東洋医学では「${m.term}」）`);
    L.push(m.sum);
    if (s) L.push(`あわせて見られる傾向：${s.nick}`);
    L.push("");
    L.push("■ なぜ眠れないの？");
    m.why.forEach((p) => L.push(p));
    L.push(`こんなサインが出やすいタイプです：${m.signs}`);
  } else {
    L.push("■ あなたの眠りのタイプ：はっきりした偏りは見られませんでした。");
  }
  L.push("");
  L.push("■ 鍼灸でどう整えるの？");
  if (state.how) L.push(state.how);
  if (state.comment) L.push(state.comment);
  L.push(`通院のペース：${state.pace}　通う期間：${state.term}`);
  if (state.termNote) L.push(state.termNote);
  L.push(`通院の流れ：${STAGES.map((st) => st.name).join(" → ")}`);
  L.push("");
  L.push("■ 暮らしのヒント");
  if (m) m.tips.forEach((t) => L.push(`・${t}`));
  sleepTips().forEach((t) => L.push(`・${t}`));
  L.push("");
  L.push("ほっと眠れる夜に向かって、一緒に進んでいきましょう。");
  L.push("");
  L.push("※この問診票は病気の診断ではなく、東洋医学の考え方でからだの傾向を知るためのものです。眠れない状態が続く方、お薬を飲んでいる方、治療中の方は、医師・専門家にもご相談ください。");
  L.push("");
  L.push(CLINIC);
  return L.join("\n");
}

function summaryText() {
  const { cs } = judge();
  const m = state.main && TYPES[state.main], s = state.sub && TYPES[state.sub];
  const lines = [];
  lines.push(`【眠りの問診票】${state.date || "日付未入力"}`);
  lines.push(`氏名：${state.name || "（未記入）"}　年齢：${state.age || "（未記入）"}`);
  lines.push(`眠れなさ：${state.kind.size ? [...state.kind].join("、") : "―"}　いつから：${state.since || "―"}`);
  lines.push(`就寝：${state.bed || "―"}　起床：${state.wake || "―"}　睡眠時間：${state.hours || "―"}`);
  lines.push(`習慣：${state.habits.size ? [...state.habits].join("、") : "なし"}${state.pill ? `（薬：${state.pill}）` : ""}`);
  const f = flagList();
  if (f.length) lines.push(`要確認：${f.map((x) => x.n).join("、")}`);
  lines.push(`集計：${cs.map((c) => `${c.term}${c.n}`).join(" / ")}（各${QPER}問）`);
  lines.push(`メイン：${m ? m.term : "なし"}　あわせて：${s ? s.term : "なし"}`);
  lines.push(`施術方針：${state.policy.replace(/\n/g, " ")}`);
  lines.push(`ツボ：${state.points}`);
  lines.push(`通院：${state.pace}　通う期間：${state.term}`);
  if (state.comment) lines.push(`ひとこと：${state.comment.replace(/\n/g, " ")}`);
  lines.push("");
  lines.push("該当項目：");
  KEYS.forEach((k) => {
    const hit = [];
    SECTIONS.forEach((sec, i) => sec.qs.forEach((q, j) => { if (q.k === k && state.checks.has(`${i}-${j}`)) hit.push(q.t); }));
    if (hit.length) lines.push(`${TYPES[k].term}）${hit.join("／")}`);
  });
  return lines.join("\n");
}

function selectEl(el) {
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

function copyText(text, okId, onFail) {
  const done = () => { $(okId).hidden = false; setTimeout(() => ($(okId).hidden = true), 2000); };
  try { navigator.clipboard.writeText(text).then(done, onFail); } catch (e) { onFail(); }
}

function bind() {
  const on = (id, key) => { const el = $(id); if (el) el.oninput = () => (state[key] = el.value); };
  on("fName", "name"); on("fDate", "date"); on("fAge", "age"); on("fPill", "pill");
  on("fPolicy", "policy"); on("fPoints", "points"); on("fHow", "how"); on("fTermNote", "termNote"); on("fComment", "comment");
  // ボタンを押したときは、画面全体を作り直さず、押したボタンの見た目だけを変える（iPad の負担を減らすため）
  document.querySelectorAll("[data-one]").forEach((b) => (b.onclick = () => {
    const f = b.dataset.one, v = b.dataset.v;
    state[f] = state[f] === v && step < STAFF_STEP ? "" : v;
    b.parentNode.querySelectorAll("[data-one]").forEach((x) => x.setAttribute("aria-pressed", state[f] === x.dataset.v));
  }));
  document.querySelectorAll("[data-many]").forEach((b) => (b.onclick = () => {
    const set = state[b.dataset.many], v = b.dataset.v;
    set.has(v) ? set.delete(v) : set.add(v);
    b.setAttribute("aria-pressed", set.has(v));
    const pill = $("fPill");
    if (pill) pill.closest(".field").hidden = !takesPill();
  }));
  document.querySelectorAll(".q").forEach((b) => (b.onclick = () => {
    const id = b.dataset.q;
    state.checks.has(id) ? state.checks.delete(id) : state.checks.add(id);
    b.setAttribute("aria-pressed", state.checks.has(id));
    const i = step - Q0;
    $("countNote").textContent = `当てはまる：${SECTIONS[i].qs.filter((_, j) => state.checks.has(`${i}-${j}`)).length} / ${SECTIONS[i].qs.length}`;
  }));
  document.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => {
    state[b.dataset.pick] = b.dataset.key || null;
    if (state.sub === state.main) state.sub = null;
    fillPlan(); render(true);
  }));
  const c = $("copyBtn");
  if (c) c.onclick = () => copyText(summaryText(), "copied", () => selectEl($("summary")));
  const cp = $("copyPatientBtn");
  if (cp) cp.onclick = () => {
    // コピーできない環境では文章を表示して、手で選んでもらう
    const pre = $("patientPre");
    pre.textContent = patientText();
    copyText(pre.textContent, "copiedPatient", () => { pre.hidden = false; selectEl(pre); });
  };
  const pb = $("printBtn");
  if (pb) pb.onclick = () => window.print();
}

$("nextBtn").onclick = () => {
  if (step === RESULT_STEP) { $("confirm").hidden = false; $("cancelReset").focus(); return; }
  if (step === LAST_Q) autoPick();
  step++; render();
};
$("backBtn").onclick = () => { if (step > 0) { step--; render(); } };
$("cancelReset").onclick = () => { $("confirm").hidden = true; };
$("doReset").onclick = () => { $("confirm").hidden = true; fresh(); render(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("confirm").hidden = true; });
// うまく動かなかったときは、画面のいちばん上に知らせる（iPad で止まったときに原因を確かめるため）
window.addEventListener("error", (e) => {
  let el = $("errNote");
  if (!el) {
    el = document.createElement("p");
    el.id = "errNote"; el.setAttribute("role", "alert");
    el.style.cssText = "background:#fde8e8;color:#8a1f1f;border:1px solid #e3a5a5;border-radius:10px;padding:10px 14px;margin:0;font-size:.95rem";
    document.querySelector(".wrap").prepend(el);
  }
  el.textContent = `うまく動かない箇所がありました。この画面の写真を撮ってください。（画面${step}：${e.message}）`;
});

window.addEventListener("unhandledrejection", (e) => { try { window.dispatchEvent(new ErrorEvent("error", { message: String(e.reason) })); } catch (x) {} });

// iPad の Safari がページを勝手に読み込み直したとき（赤い知らせが出ずに止まったとき）に、どの画面だったかを知らせる。
// 覚えておくのは画面の番号と最後の操作だけで、入力した内容は残さない
const TRACE_KEY = "fumin-trace";
const trace = (what) => { try { sessionStorage.setItem(TRACE_KEY, `${step}|${what}|${new Date().toLocaleTimeString("ja-JP")}`); } catch (e) {} };
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) trace(b.id === "nextBtn" ? "次へを押した" : b.id === "backBtn" ? "もどるを押した" : "ボタンをタップした");
}, true);
(() => {
  let last = null;
  try { last = sessionStorage.getItem(TRACE_KEY); sessionStorage.removeItem(TRACE_KEY); } catch (e) {}
  render();
  if (!last) return;
  const [st, what, time] = last.split("|");
  if (st === "0") return;
  const el = document.createElement("p");
  el.setAttribute("role", "alert");
  el.style.cssText = "background:#fff6db;color:#6b4e00;border:1px solid #e6cf85;border-radius:10px;padding:10px 14px;margin:0;font-size:.95rem";
  el.textContent = `前回は画面${st}で「${what}」あと（${time}）に、ページが読み込み直されました。止まったときは、この画面の写真を撮ってください。`;
  document.querySelector(".wrap").prepend(el);
})();
</script>
</body>
</html>
